<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hemera TCG — Expanded Gauntlet</title>
  <meta name="color-scheme" content="dark light" />
  <meta name="description" content="Expanded Gauntlet — decks and guides for the Expanded format" />
  <link rel="icon" href="./expanded-decks/assets/icons/calyrex-shadow-rider.png"/>
  <link rel="stylesheet" href="./dist/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-base-900 text-white font-display selection:bg-accent-500/40 selection:text-white">
  <div class="fixed -z-10 inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-40 -left-20 h-80 w-80 rounded-full blur-3xl opacity-30" style="background: radial-gradient(closest-side, #7C3AED, transparent)"></div>
    <div class="absolute top-40 right-0 h-96 w-96 rounded-full blur-3xl opacity-20" style="background: radial-gradient(closest-side, #00E5FF, transparent)"></div>
  </div>

  <header class="sticky top-0 z-40 backdrop-blur-xl supports-[backdrop-filter]:bg-base-950/80 bg-base-950/90 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <a href="./" class="group inline-flex items-center gap-3 hover:opacity-80 transition">
          <img src="./expanded-decks/assets/icons/calyrex-shadow-rider.png" alt="Hemera" class="h-9 w-9 object-contain drop-shadow-lg">
          <span class="text-lg font-bold tracking-tight">Hemera TCG</span>
          <span class="ml-2 text-xs px-2.5 py-1 rounded-full bg-accent-500/20 border border-accent-500/30 text-accent-300 font-medium">Expanded</span>
        </a>
        <nav class="flex items-center gap-1">
          <a href="./index.html" class="px-4 py-2 rounded-lg text-sm font-medium bg-accent-500/10 text-white border border-accent-500/20 shadow-glow">
            <span class="hidden sm:inline">Expanded Gauntlet</span>
            <span class="sm:hidden">Gauntlet</span>
          </a>
          <a href="#" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5 border border-transparent transition">
            <span class="hidden sm:inline">Needed Cards</span>
            <span class="sm:hidden">Cards</span>
          </a>
          <a href="./contact.html" class="px-4 py-2 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5 border border-transparent transition">
            <span class="hidden sm:inline">Contact</span>
            <svg class="sm:hidden h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </a>
          <button id="downloadTemplate" class="p-2 rounded-lg text-white/70 hover:text-white hover:bg-white/5 border border-transparent transition" title="Download Deck Template">
            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
          </button>
        </nav>
      </div>
    </div>

    <div class="border-t border-white/5">
      <div class="max-w-6xl mx-auto px-4 sm:px-4 py-3 sm:py-5">
        <div class="flex items-start gap-2 sm:gap-3">
          <div id="deckScroller" class="flex-1 flex items-center gap-2 sm:gap-4 overflow-x-auto pb-2 px-1">
            <!-- deck buttons injected here -->
          </div>
          <button type="button" id="expandToggle" class="shrink-0 mt-1 p-2 sm:p-2.5 rounded-xl border border-white/10 bg-white/5 hover:bg-white/10 hover:border-accent-500/30 transition-all" title="Déplier/Replier">
            <svg id="expandIcon" class="h-4 w-4 sm:h-5 sm:w-5 text-white/70 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8 pb-12 sm:pb-16">
    <section id="content" class="relative">
      <article id="deckContent" class="prose prose-invert max-w-none">
        <!-- Rendered markdown goes here -->
      </article>
    </section>
  </main>

  <footer class="border-t border-white/10 bg-base-950/50 py-8">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4 text-white/50 text-sm">
      <div class="flex items-center gap-2">
        <span>© <span id="year"></span> Hemera TCG · Expanded Format</span>
        <span class="text-white/30">·</span>
        <span class="text-accent-300/70 font-medium">Community Driven</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="./contact.html" class="hover:text-accent-300 transition">Contact</a>
        <a href="#top" class="hover:text-accent-300 transition">Back to Top</a>
      </div>
    </div>
  </footer>

  <script src="script.js?v=2.0"></script>
</body>
</html>
