<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hemera TCG — Contact</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="expanded-decks/assets/icons/calyrex-shadow-rider.png"/>
  <link rel="stylesheet" href="./dist/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-base-900 text-white font-[Inter]">
  <div class="fixed -z-10 inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute -top-40 -left-20 h-80 w-80 rounded-full blur-3xl opacity-30" style="background: radial-gradient(closest-side, #7C3AED, transparent)"></div>
    <div class="absolute top-40 right-0 h-96 w-96 rounded-full blur-3xl opacity-20" style="background: radial-gradient(closest-side, #00E5FF, transparent)"></div>
  </div>

  <header class="sticky top-0 z-40 backdrop-blur-xl supports-[backdrop-filter]:bg-base-950/80 bg-base-950/90 border-b border-white/10">
    <div class="max-w-3xl mx-auto px-4">
      <div class="flex items-center justify-between h-16">
        <a href="./" class="group inline-flex items-center gap-3 hover:opacity-80 transition">
          <img src="expanded-decks/assets/icons/regidrago.png" alt="Hemera" class="h-9 w-9 drop-shadow-lg">
          <span class="text-lg font-bold tracking-tight">Hemera TCG</span>
        </a>
        <nav class="flex items-center gap-1">
          <a href="./index.html" class="px-4 py-2 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5 border border-transparent transition">Expanded Gauntlet</a>
          <a href="#" target="_blank" rel="noopener noreferrer" class="px-4 py-2 rounded-lg text-sm font-medium text-white/70 hover:text-white hover:bg-white/5 border border-transparent transition">
            <span class="hidden sm:inline">Needed Cards</span>
            <span class="sm:hidden">Cards</span>
          </a>
          <a href="./contact.html" class="px-4 py-2 rounded-lg text-sm font-medium bg-accent-500/10 text-white border border-accent-500/20 shadow-glow">Contact</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-10 pb-20">
    <section class="text-center mb-10">
      <h1 class="text-4xl font-bold tracking-tight bg-gradient-to-r from-white via-accent-300 to-cyan-400 bg-clip-text text-transparent">Contact</h1>
      <p class="mt-3 text-white/60">Useful links & socials</p>
    </section>

    <section class="space-y-4">
      <a href="https://discord.gg/ercwJFBy42" id="havre-link" target="_blank" rel="noreferrer" class="glass rounded-2xl p-5 flex items-center gap-5 transition group">
        <div class="h-12 w-12 rounded-xl bg-accent-500/10 border border-accent-500/20 p-2 flex items-center justify-center">
          <img src="social-icons/havre.png" alt="Havre de Duel" class="h-full w-full object-contain">
        </div>
        <div class="flex-1 text-left">
          <div class="font-semibold text-base group-hover:text-accent-300 transition">Havre de Duel</div>
          <div class="text-sm text-white/60">Personal Discord Server</div>
        </div>
        <span class="text-accent-300 text-sm font-medium">Join →</span>
      </a>

      <a href="https://discord.gg/VKaFT95Z2z" id="silent-link" target="_blank" rel="noreferrer" class="glass rounded-2xl p-5 flex items-center gap-5 transition group">
        <div class="h-12 w-12 rounded-xl bg-accent-500/10 border border-accent-500/20 p-2 flex items-center justify-center">
          <img src="social-icons/silent-lab.png" alt="Silent Lab" class="h-full w-full object-contain">
        </div>
        <div class="flex-1 text-left">
          <div class="font-semibold text-base group-hover:text-accent-300 transition">Silent Lab</div>
          <div class="text-sm text-white/60">Discord — Expanded Format</div>
        </div>
        <span class="text-accent-300 text-sm font-medium">Join →</span>
      </a>

      <div class="glass rounded-2xl p-5 flex items-center gap-5 border">
        <div class="h-12 w-12 rounded-xl bg-accent-500/10 border border-accent-500/20 p-2 flex items-center justify-center">
          <img src="social-icons/discord.png" alt="Discord" class="h-full w-full object-contain">
        </div>
        <div class="flex-1 text-left">
          <div class="font-semibold text-base">Discord (DM)</div>
          <div class="text-sm text-white/60 font-mono">x.hemera</div>
        </div>
        <button id="copyDiscord" class="px-4 py-2 rounded-lg bg-white/5 border border-white/10 text-sm hover:bg-white/10 hover:border-accent-500/30 transition font-medium">Copy</button>
      </div>

      <a href="https://instagram.com/tony.bsrd" target="_blank" rel="noreferrer" class="glass rounded-2xl p-5 flex items-center gap-5 transition group">
        <div class="h-12 w-12 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 p-2 flex items-center justify-center">
          <img src="social-icons/Instagram.png" alt="Instagram" class="h-full w-full object-contain">
        </div>
        <div class="flex-1 text-left">
          <div class="font-semibold text-base group-hover:text-cyan-300 transition">Instagram</div>
          <div class="text-sm text-white/60">@tony.bsrd</div>
        </div>
        <span class="text-cyan-300 text-sm font-medium">Open →</span>
      </a>
    </section>
  </main>

  <script>
    const $ = (s, r=document) => r.querySelector(s);
    const copyBtn = $('#copyDiscord');
    copyBtn?.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('x.hemera');
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1500);
      } catch {}
    });
  </script>
</body>
</html>
