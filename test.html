<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Test Marked</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <h1>Test de chargement Markdown</h1>
  <div id="content" style="border: 1px solid #ccc; padding: 20px; margin: 20px; background: #f5f5f5; color: #000;">
    Chargement...
  </div>

  <script>
    console.log('Script started');
    console.log('Marked loaded?', typeof marked !== 'undefined');

    async function testLoad() {
      try {
        const res = await fetch('./expanded-decks/regidrago-vstar.md');
        console.log('Fetch status:', res.status);
        const md = await res.text();
        console.log('MD length:', md.length);
        console.log('MD content:', md.substring(0, 100));

        let html;
        if (typeof marked.parse === 'function') {
          html = marked.parse(md);
        } else if (typeof marked === 'function') {
          html = marked(md);
        }

        console.log('HTML length:', html.length);
        document.getElementById('content').innerHTML = html;
        console.log('Done!');
      } catch (e) {
        console.error('Error:', e);
        document.getElementById('content').innerHTML = 'Error: ' + e.message;
      }
    }

    testLoad();
  </script>
</body>
</html>
